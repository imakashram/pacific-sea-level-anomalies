# Netlify configuration file for monorepo deployment

[build]
  # Build the frontend from the root workspace
  command = "pnpm run build:story"
  # Set the publish directory where Vite outputs the production build
  publish = "artifacts/pacific-climate-story/dist/public"

# Redirect rules (handles API proxying and client-side routing fallback)
[[redirects]]
  from = "/api/*"
  to = "https://pacificocean.insightcrust.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
