openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pacific Island Climate Change Data Story API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: climate
    description: Climate change data endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /climate/overview:
    get:
      operationId: getClimateOverview
      tags: [climate]
      summary: Key headline metrics
      responses:
        "200":
          description: Overview statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimateOverview"

  /climate/sea-level-trend:
    get:
      operationId: getSeaLevelTrend
      tags: [climate]
      summary: Aggregated annual sea level trend across all countries
      responses:
        "200":
          description: Yearly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /climate/sea-level-by-country:
    get:
      operationId: getSeaLevelByCountry
      tags: [climate]
      summary: Sea level anomaly time series per country
      responses:
        "200":
          description: Country time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryTimeSeries"

  /climate/country-comparison:
    get:
      operationId: getCountryComparison
      tags: [climate]
      summary: Cumulative sea level rise comparison across countries
      responses:
        "200":
          description: Country comparison data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryComparison"

  /climate/anomalies:
    get:
      operationId: getClimateAnomalies
      tags: [climate]
      summary: Notable anomalies and outliers
      responses:
        "200":
          description: Notable climate anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClimateAnomaly"

  /climate/heatmap:
    get:
      operationId: getClimateHeatmap
      tags: [climate]
      summary: Country × year heatmap matrix
      responses:
        "200":
          description: Heatmap matrix data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapData"

  /climate/decade-analysis:
    get:
      operationId: getDecadeAnalysis
      tags: [climate]
      summary: Per-country and global averages across 3 decades
      description: Breaks sea level data into 3 decades (1993-2002, 2003-2012, 2013-2023) to show escalation over time
      responses:
        "200":
          description: Decade analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecadeAnalysis"

  /climate/rate-of-change:
    get:
      operationId: getRateOfChange
      tags: [climate]
      summary: Year-over-year delta and rolling average of global sea level
      description: Annual YoY change plus 5-year centered rolling average to reveal acceleration signal
      responses:
        "200":
          description: Rate of change data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RateOfChangePoint"

  /climate/volatility:
    get:
      operationId: getVolatility
      tags: [climate]
      summary: Per-country volatility (standard deviation) and mean anomaly
      description: Enables scatter plot of mean vs volatility — reveals which nations face chaotic vs steady rise
      responses:
        "200":
          description: Volatility data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolatilityData"

  /climate/acceleration:
    get:
      operationId: getAcceleration
      tags: [climate]
      summary: Linear slope of sea level rise per country across time windows
      description: Full-period, first-half, and second-half linear slopes reveal where rise is speeding up most
      responses:
        "200":
          description: Acceleration data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccelerationPoint"

  /climate/rankings:
    get:
      operationId: getRankings
      tags: [climate]
      summary: Full sortable analytics table for all countries
      description: All key metrics per country in one response — designed for a rich sortable data table
      responses:
        "200":
          description: Rankings data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryRanking"

  /climate/cumulative-rise-timeseries:
    get:
      operationId: getCumulativeRiseTimeseries
      tags: [climate]
      summary: Per-country cumulative rise from 1993 baseline, year-by-year
      description: For each country, the year-by-year departure from its own 1993 sea level, enabling a multi-line racing trajectory chart
      responses:
        "200":
          description: Cumulative rise timeseries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CumulativeRiseData"

  /climate/nations-rising-by-year:
    get:
      operationId: getNationsRisingByYear
      tags: [climate]
      summary: Count and percentage of nations with positive sea level anomaly each year
      responses:
        "200":
          description: Nations rising per year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NationsRisingPoint"

  /climate/forecast:
    get:
      operationId: getForecast
      tags: [climate]
      summary: 10-year sea level projection with confidence bands
      description: Linear regression extrapolation from 1993-2023 data projected through 2033, with ±2σ confidence intervals
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastData"

  /climate/risk-scores:
    get:
      operationId: getRiskScores
      tags: [climate]
      summary: Composite climate risk score per country
      description: 0-100 risk score combining cumulative rise, slope, volatility, and decade acceleration
      responses:
        "200":
          description: Risk score data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScoreData"

  /climate/country-profile/{code}:
    get:
      operationId: getCountryProfile
      tags: [climate]
      summary: Full deep-dive profile for a single country
      description: Time series with rolling avg, decade breakdown, stats, and rank vs peers
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: ISO country code (e.g. FJ, TV, WS)
      responses:
        "200":
          description: Country profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryProfile"
        "404":
          description: Country not found

  /climate/geographic-clusters:
    get:
      operationId: getGeographicClusters
      tags: [climate]
      summary: Sea level data grouped by Pacific sub-region (Polynesia, Melanesia, Micronesia)
      responses:
        "200":
          description: Geographic cluster data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeographicClustersData"

  /climate/threshold-crossings:
    get:
      operationId: getThresholdCrossings
      tags: [climate]
      summary: Year each nation first crossed key sea level thresholds
      responses:
        "200":
          description: Threshold crossing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdCrossingsData"

  /climate/el-nino-impact:
    get:
      operationId: getElNinoImpact
      tags: [climate]
      summary: Per-nation 1997-2000 sea level values showing El Niño suppression and recovery
      responses:
        "200":
          description: El Niño impact data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElNinoImpactData"

  /climate/enso-sensitivity:
    get:
      operationId: getENSOSensitivity
      tags: [climate]
      summary: Per-nation sea level anomaly averaged by ENSO phase (El Niño, La Niña, neutral)
      description: Sensitivity = La Niña avg − El Niño avg. El Niño years 1997-98 and 2015-16; La Niña years 2010-11 and 2020-21.
      responses:
        "200":
          description: ENSO sensitivity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ENSOSensitivityData"

  /climate/correlation-matrix:
    get:
      operationId: getCorrelationMatrix
      tags: [climate]
      summary: Pearson correlation matrix between all 21 Pacific nations' annual sea level time series
      description: 21×21 matrix of Pearson r values. Reveals which nations share oceanographic fate.
      responses:
        "200":
          description: Correlation matrix data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrelationMatrixData"

  /climate/nation-rankings:
    get:
      operationId: getNationRankings
      tags: [climate]
      summary: Per-year rank of each nation by sea level anomaly (rank 1=lowest, rank 21=highest)
      responses:
        "200":
          description: Nation rankings over time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NationRankingsData"

  /climate/decade-distributions:
    get:
      operationId: getDecadeDistributions
      tags: [climate]
      summary: Box-and-whisker statistics per decade for Pacific-wide and per-nation distributions
      responses:
        "200":
          description: Decade distribution data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecadeDistributionsData"

  /climate/nation-treemap:
    get:
      operationId: getNationTreemap
      tags: [climate]
      summary: Per-nation total rise, acceleration, and volatility for treemap visualization
      responses:
        "200":
          description: Nation treemap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NationTreemapData"

  /climate/threshold-funnel:
    get:
      operationId: getThresholdFunnel
      tags: [climate]
      summary: Cascading count of nations above successive sea level thresholds with historical comparison
      responses:
        "200":
          description: Threshold funnel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdFunnelData"

  /climate/regional-streams:
    get:
      operationId: getRegionalStreams
      tags: [climate]
      summary: Per-year per-region mean anomaly for silhouette streamgraph
      responses:
        "200":
          description: Regional streams data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalStreamsData"

  /climate/annual-deviation:
    get:
      operationId: getAnnualDeviation
      tags: [climate]
      summary: Pacific-wide annual mean deviation from 30-year grand mean for lollipop chart
      responses:
        "200":
          description: Annual deviation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnualDeviationData"

  /climate/start-end-comparison:
    get:
      operationId: getStartEndComparison
      tags: [climate]
      summary: Per-nation 1993 vs 2023 anomaly values and total change for dumbbell chart
      responses:
        "200":
          description: Start/end comparison data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartEndComparisonData"

  /climate/regional-decade-shares:
    get:
      operationId: getRegionalDecadeShares
      tags: [climate]
      summary: Per-decade proportional share of sea level rise by geographic region
      responses:
        "200":
          description: Regional decade shares data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalDecadeSharesData"

  /climate/nation-metrics:
    get:
      operationId: getNationMetrics
      tags: [climate]
      summary: Per-nation multi-metric data with normalized values for parallel coordinates
      responses:
        "200":
          description: Nation metrics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NationMetricsData"

  /climate/yoy-budget:
    get:
      operationId: getYoyBudget
      tags: [climate]
      summary: Year-over-year change in Pacific-wide average sea level anomaly for waterfall chart
      responses:
        "200":
          description: YoY budget data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoyBudgetData"

  /climate/anomaly-profiles:
    get:
      operationId: getAnomalyProfiles
      tags: [climate]
      summary: Per-nation array of all annual sea level anomaly values and distribution stats
      responses:
        "200":
          description: Anomaly profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyProfilesData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ClimateOverview:
      type: object
      properties:
        totalCountries:
          type: integer
        yearRange:
          type: object
          properties:
            start:
              type: integer
            end:
              type: integer
          required: [start, end]
        totalObservations:
          type: integer
        avgRiseMeters:
          type: number
        maxRiseCountry:
          type: string
        maxRiseValue:
          type: number
        countriesAboveAvg:
          type: integer
        elNinoYear:
          type: integer
        recentDecadeAvg:
          type: number
        baselineDecadeAvg:
          type: number
      required:
        - totalCountries
        - yearRange
        - totalObservations
        - avgRiseMeters
        - maxRiseCountry
        - maxRiseValue
        - countriesAboveAvg
        - elNinoYear
        - recentDecadeAvg
        - baselineDecadeAvg

    TrendDataPoint:
      type: object
      properties:
        year:
          type: integer
        avgAnomaly:
          type: number
        minAnomaly:
          type: number
        maxAnomaly:
          type: number
        countriesRising:
          type: integer
      required: [year, avgAnomaly, minAnomaly, maxAnomaly, countriesRising]

    CountryTimeSeries:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              value:
                type: number
            required: [year, value]
        cumulativeRise:
          type: number
        trend:
          type: string
          enum: [rising, stable, variable]
      required: [country, code, data, cumulativeRise, trend]

    CountryComparison:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        latestAnomaly:
          type: number
        cumulativeRise:
          type: number
        averageAnomaly:
          type: number
        peakYear:
          type: integer
        peakValue:
          type: number
      required: [country, code, latestAnomaly, cumulativeRise, averageAnomaly, peakYear, peakValue]

    ClimateAnomaly:
      type: object
      properties:
        year:
          type: integer
        country:
          type: string
        code:
          type: string
        value:
          type: number
        type:
          type: string
          enum: [peak, trough, shift]
        description:
          type: string
      required: [year, country, code, value, type, description]

    HeatmapData:
      type: object
      properties:
        years:
          type: array
          items:
            type: integer
        countries:
          type: array
          items:
            type: string
        matrix:
          type: array
          items:
            type: array
            items:
              type: number
        minValue:
          type: number
        maxValue:
          type: number
      required: [years, countries, matrix, minValue, maxValue]

    DecadeCountryRow:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        d1:
          type: number
          description: Average anomaly 1993–2002
        d2:
          type: number
          description: Average anomaly 2003–2012
        d3:
          type: number
          description: Average anomaly 2013–2023
        acceleration:
          type: number
          description: d3 minus d1 — net change across the study period
      required: [country, code, d1, d2, d3, acceleration]

    GlobalDecadeAvg:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        avg:
          type: number
      required: [key, label, avg]

    DecadeAnalysis:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/DecadeCountryRow"
        globalDecades:
          type: array
          items:
            $ref: "#/components/schemas/GlobalDecadeAvg"
      required: [countries, globalDecades]

    RateOfChangePoint:
      type: object
      properties:
        year:
          type: integer
        avgAnomaly:
          type: number
        yoyDelta:
          type: number
          nullable: true
          description: Year-over-year change in global average (null for first year)
        rollingAvg:
          type: number
          description: 5-year centered rolling average
      required: [year, avgAnomaly, rollingAvg]

    VolatilityCountry:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        mean:
          type: number
        volatility:
          type: number
        observations:
          type: integer
      required: [country, code, mean, volatility, observations]

    VolatilityData:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/VolatilityCountry"
        globalMean:
          type: number
        globalVolatility:
          type: number
      required: [countries, globalMean, globalVolatility]

    AccelerationPoint:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        slopeFullPeriod:
          type: number
          description: Linear slope (m/year) over full 1993–2023 period
        slopeFirstHalf:
          type: number
          description: Slope over first half of the period
        slopeSecondHalf:
          type: number
          description: Slope over second half of the period
        accelerating:
          type: boolean
          description: True if second-half slope exceeds first-half slope
      required: [country, code, slopeFullPeriod, slopeFirstHalf, slopeSecondHalf, accelerating]

    CountryRanking:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        mean:
          type: number
        volatility:
          type: number
        cumulativeRise:
          type: number
        peakValue:
          type: number
        peakYear:
          type: integer
        troughValue:
          type: number
        troughYear:
          type: integer
        slope:
          type: number
        d1Avg:
          type: number
        d3Avg:
          type: number
        decadeAcceleration:
          type: number
        observations:
          type: integer
      required:
        - country
        - code
        - mean
        - volatility
        - cumulativeRise
        - peakValue
        - peakYear
        - troughValue
        - troughYear
        - slope
        - d1Avg
        - d3Avg
        - decadeAcceleration
        - observations

    ForecastPoint:
      type: object
      properties:
        year:
          type: integer
        projected:
          type: number
          description: Projected average sea level anomaly
        lower:
          type: number
          description: Lower confidence bound (−2σ)
        upper:
          type: number
          description: Upper confidence bound (+2σ)
      required: [year, projected, lower, upper]

    HistoricalForecastPoint:
      type: object
      properties:
        year:
          type: integer
        avgAnomaly:
          type: number
      required: [year, avgAnomaly]

    ForecastData:
      type: object
      properties:
        historical:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalForecastPoint"
        projected:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        slopeMmPerYear:
          type: number
          description: Linear trend slope in mm/year
        r2:
          type: number
          description: Coefficient of determination (model fit quality)
        projectedRise2030:
          type: number
          description: Projected cumulative anomaly increase by 2030
        projectedRise2033:
          type: number
          description: Projected cumulative anomaly increase by 2033
      required: [historical, projected, slopeMmPerYear, r2, projectedRise2030, projectedRise2033]

    RiskScoreComponents:
      type: object
      properties:
        riseScore:
          type: number
        slopeScore:
          type: number
        volatilityScore:
          type: number
        accelerationScore:
          type: number
      required: [riseScore, slopeScore, volatilityScore, accelerationScore]

    RiskScore:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        riskScore:
          type: number
          description: Composite risk score 0–100
        riskLevel:
          type: string
          enum: [Critical, High, Medium, Low]
        components:
          $ref: "#/components/schemas/RiskScoreComponents"
        cumulativeRise:
          type: number
        slope:
          type: number
        volatility:
          type: number
        decadeAcceleration:
          type: number
      required: [country, code, riskScore, riskLevel, components, cumulativeRise, slope, volatility, decadeAcceleration]

    RiskScoreData:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/RiskScore"
        avgRiskScore:
          type: number
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer
      required: [countries, avgRiskScore, criticalCount, highCount, mediumCount, lowCount]

    CountryProfileTimeSeries:
      type: object
      properties:
        year:
          type: integer
        value:
          type: number
        rollingAvg:
          type: number
      required: [year, value, rollingAvg]

    CountryProfileDecade:
      type: object
      properties:
        label:
          type: string
        avg:
          type: number
        count:
          type: integer
      required: [label, avg, count]

    CountryProfileStats:
      type: object
      properties:
        mean:
          type: number
        volatility:
          type: number
        cumulativeRise:
          type: number
        slope:
          type: number
        peakValue:
          type: number
        peakYear:
          type: integer
        troughValue:
          type: number
        troughYear:
          type: integer
        observations:
          type: integer
        rankByCumulativeRise:
          type: integer
        totalCountries:
          type: integer
      required:
        - mean
        - volatility
        - cumulativeRise
        - slope
        - peakValue
        - peakYear
        - troughValue
        - troughYear
        - observations
        - rankByCumulativeRise
        - totalCountries

    CountryProfile:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        timeSeries:
          type: array
          items:
            $ref: "#/components/schemas/CountryProfileTimeSeries"
        decadeBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CountryProfileDecade"
        stats:
          $ref: "#/components/schemas/CountryProfileStats"
      required: [country, code, timeSeries, decadeBreakdown, stats]

    CumulativeRiseCountry:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        totalRise:
          type: number
        data:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              cumulative:
                type: number
              raw:
                type: number
            required: [year, cumulative, raw]
      required: [country, code, totalRise, data]

    CumulativeRiseData:
      type: object
      properties:
        years:
          type: array
          items:
            type: integer
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CumulativeRiseCountry"
      required: [years, countries]

    NationsRisingPoint:
      type: object
      properties:
        year:
          type: integer
        count:
          type: integer
        total:
          type: integer
        pct:
          type: number
        avgAnomaly:
          type: number
      required: [year, count, total, pct, avgAnomaly]

    ElNinoNation:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        v1997:
          type: number
          nullable: true
        v1998:
          type: number
          nullable: true
        v1999:
          type: number
          nullable: true
        v2000:
          type: number
          nullable: true
        drop:
          type: number
          nullable: true
          description: 1998 value minus pre-event average (negative = suppression)
        recovery:
          type: number
          nullable: true
          description: Post-event average minus 1998 value (positive = rebound)
      required: [country, code, v1997, v1998, v1999, v2000, drop, recovery]

    ElNinoImpactData:
      type: object
      properties:
        nations:
          type: array
          items:
            $ref: "#/components/schemas/ElNinoNation"
        globalAvg1997:
          type: number
        globalAvg1998:
          type: number
