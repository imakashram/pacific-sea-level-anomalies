openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pacific Island Climate Change Data Story API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sea-level-anomalies
    description: Sea level anomalies data endpoints
  - name: core
    description: Core API endpoints
  - name: story
    description: Story section endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sea-level-anomalies/overview:
    get:
      operationId: getSeaLevelAnomaliesOverview
      tags: [sea-level-anomalies]
      summary: Key headline metrics
      responses:
        "200":
          description: Overview statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeaLevelAnomaliesOverview"

  /sea-level-anomalies/sea-level-trend:
    get:
      operationId: getSeaLevelTrend
      tags: [sea-level-anomalies]
      summary: Aggregated annual sea level trend across all countries
      responses:
        "200":
          description: Yearly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /sea-level-anomalies/sea-level-by-country:
    get:
      operationId: getSeaLevelByCountry
      tags: [sea-level-anomalies]
      summary: Sea level anomaly time series per country
      responses:
        "200":
          description: Country time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryTimeSeries"

  /sea-level-anomalies/heatmap:
    get:
      operationId: getSeaLevelAnomaliesHeatmap
      tags: [sea-level-anomalies]
      summary: Country × year heatmap matrix
      responses:
        "200":
          description: Heatmap matrix data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapData"

  /sea-level-anomalies/decade-analysis:
    get:
      operationId: getDecadeAnalysis
      tags: [sea-level-anomalies]
      summary: Per-country and global averages across 3 decades
      description: Breaks sea level data into 3 decades (1993-2002, 2003-2012, 2013-2023) to show escalation over time
      responses:
        "200":
          description: Decade analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecadeAnalysis"

  /sea-level-anomalies/volatility:
    get:
      operationId: getVolatility
      tags: [sea-level-anomalies]
      summary: Per-country volatility (standard deviation) and mean anomaly
      description: Enables scatter plot of mean vs volatility — reveals which nations face chaotic vs steady rise
      responses:
        "200":
          description: Volatility data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolatilityData"

  /sea-level-anomalies/acceleration:
    get:
      operationId: getAcceleration
      tags: [sea-level-anomalies]
      summary: Linear slope of sea level rise per country across time windows
      description: Full-period, first-half, and second-half linear slopes reveal where rise is speeding up most
      responses:
        "200":
          description: Acceleration data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccelerationPoint"

  /sea-level-anomalies/rankings:
    get:
      operationId: getRankings
      tags: [sea-level-anomalies]
      summary: Full sortable analytics table for all countries
      description: All key metrics per country in one response — designed for a rich sortable data table
      responses:
        "200":
          description: Rankings data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryRanking"

  /sea-level-anomalies/forecast:
    get:
      operationId: getForecast
      tags: [sea-level-anomalies]
      summary: 10-year sea level projection with confidence bands
      description: Linear regression extrapolation from 1993-2023 data projected through 2033, with ±2σ confidence intervals
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastData"

  /sea-level-anomalies/risk-scores:
    get:
      operationId: getRiskScores
      tags: [sea-level-anomalies]
      summary: Composite climate risk score per country
      description: 0-100 risk score combining cumulative rise, slope, volatility, and decade acceleration
      responses:
        "200":
          description: Risk score data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScoreData"

  /sea-level-anomalies/country-profile/{code}:
    get:
      operationId: getCountryProfile
      tags: [sea-level-anomalies]
      summary: Full deep-dive profile for a single country
      description: Time series with rolling avg, decade breakdown, stats, and rank vs peers
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: ISO country code (e.g. FJ, TV, WS)
      responses:
        "200":
          description: Country profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryProfile"
        "404":
          description: Country not found


  /sea-level-anomalies/threshold-crossings:
    get:
      operationId: getThresholdCrossings
      tags: [sea-level-anomalies]
      summary: Year each nation first crossed key sea level thresholds
      responses:
        "200":
          description: Threshold crossing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdCrossingsData"


  /sea-level-anomalies/enso-sensitivity:
    get:
      operationId: getENSOSensitivity
      tags: [sea-level-anomalies]
      summary: Per-nation sea level anomaly averaged by ENSO phase (El Niño, La Niña, neutral)
      description: Sensitivity = La Niña avg − El Niño avg. El Niño years 1997-98 and 2015-16; La Niña years 2010-11 and 2020-21.
      responses:
        "200":
          description: ENSO sensitivity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ENSOSensitivityData"

  /sea-level-anomalies/annual-deviation:
    get:
      operationId: getAnnualDeviation
      tags: [sea-level-anomalies]
      summary: Pacific-wide annual mean deviation from 30-year grand mean for lollipop chart
      responses:
        "200":
          description: Annual deviation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnualDeviationData"
  /core/overview:
    get:
      operationId: getCoreOverview
      tags: [core]
      summary: Key headline metrics
      responses:
        "200":
          description: Overview statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeaLevelAnomaliesOverview"

  /core/sea-level-by-country:
    get:
      operationId: getCoreSeaLevelByCountry
      tags: [core]
      summary: Sea level anomaly time series per country
      responses:
        "200":
          description: Country time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryTimeSeries"

  /core/country-profile/{code}:
    get:
      operationId: getCoreCountryProfile
      tags: [core]
      summary: Full deep-dive profile for a single country
      description: Time series with rolling avg, decade breakdown, stats, and rank vs peers
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: ISO country code (e.g. FJ, TV, WS)
      responses:
        "200":
          description: Country profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryProfile"
        "404":
          description: Country not found

  /core/sea-level-trend:
    get:
      operationId: getCoreSeaLevelTrend
      tags: [core]
      summary: Aggregated annual sea level trend across all countries
      responses:
        "200":
          description: Yearly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /story/hero-section:
    get:
      operationId: getHeroSection
      tags: [story]
      summary: Aligned data for Hero Section
      responses:
        "200":
          description: Hero section telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroSectionData"

  /story/data-landscape:
    get:
      operationId: getDataLandscape
      tags: [story]
      summary: Aligned data for Data Landscape section
      responses:
        "200":
          description: Data landscape overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeaLevelAnomaliesOverview"

  /story/ocean-rising:
    get:
      operationId: getOceanRising
      tags: [story]
      summary: Aligned data for Ocean Is Rising section
      responses:
        "200":
          description: Ocean is rising trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /story/pace-of-change:
    get:
      operationId: getPaceOfChange
      tags: [story]
      summary: Aligned data for Pace of Change section
      responses:
        "200":
          description: Acceleration metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccelerationPoint"

  /story/enso-effect:
    get:
      operationId: getEnsoEffect
      tags: [story]
      summary: Aligned data for ENSO Effect section
      responses:
        "200":
          description: ENSO sensitivity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ENSOSensitivityData"

  /story/patterns-over-time:
    get:
      operationId: getPatternsOverTime
      tags: [story]
      summary: Aligned data for Patterns over Time section
      responses:
        "200":
          description: Heatmap matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapData"

  /story/future-outlook:
    get:
      operationId: getFutureOutlook
      tags: [story]
      summary: Aligned data for Future Outlook section
      responses:
        "200":
          description: Projected forecast data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastData"

  /story/risk-assessment:
    get:
      operationId: getRiskAssessment
      tags: [story]
      summary: Aligned data for Risk Assessment section
      responses:
        "200":
          description: Risk score details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScoreData"

  /story/pacific-at-a-glance:
    get:
      operationId: getPacificAtAGlance
      tags: [story]
      summary: Aligned data for Pacific at a Glance section
      responses:
        "200":
          description: Full sortable rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryRanking"

  /story/explore-any-nation/{code}:
    get:
      operationId: getExploreAnyNation
      tags: [story]
      summary: Aligned data for Explore Any Nation sub-section
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: ISO country code (e.g. FJ, TV, WS)
      responses:
        "200":
          description: Country profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryProfile"
        "404":
          description: Country not found

  /story/what-this-means:
    get:
      operationId: getWhatThisMeans
      tags: [story]
      summary: Aligned data for What This Means section
      responses:
        "200":
          description: Threshold crossings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdCrossingsData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SeaLevelAnomaliesOverview:
      type: object
      properties:
        totalCountries:
          type: integer
        yearRange:
          type: object
          properties:
            start:
              type: integer
            end:
              type: integer
          required: [start, end]
        totalObservations:
          type: integer
        avgRiseMeters:
          type: number
        maxRiseCountry:
          type: string
        maxRiseValue:
          type: number
        countriesAboveAvg:
          type: integer
        elNinoYear:
          type: integer
        recentDecadeAvg:
          type: number
        baselineDecadeAvg:
          type: number
      required:
        - totalCountries
        - yearRange
        - totalObservations
        - avgRiseMeters
        - maxRiseCountry
        - maxRiseValue
        - countriesAboveAvg
        - elNinoYear
        - recentDecadeAvg
        - baselineDecadeAvg

    TrendDataPoint:
      type: object
      properties:
        year:
          type: integer
        avgAnomaly:
          type: number
        minAnomaly:
          type: number
        maxAnomaly:
          type: number
        countriesRising:
          type: integer
      required: [year, avgAnomaly, minAnomaly, maxAnomaly, countriesRising]

    CountryTimeSeries:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              value:
                type: number
            required: [year, value]
        cumulativeRise:
          type: number
        trend:
          type: string
          enum: [rising, stable, variable]
      required: [country, code, data, cumulativeRise, trend]

    HeatmapData:
      type: object
      properties:
        years:
          type: array
          items:
            type: integer
        countries:
          type: array
          items:
            type: string
        matrix:
          type: array
          items:
            type: array
            items:
              type: number
        minValue:
          type: number
        maxValue:
          type: number
      required: [years, countries, matrix, minValue, maxValue]

    DecadeCountryRow:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        d1:
          type: number
          description: Average anomaly 1993–2002
        d2:
          type: number
          description: Average anomaly 2003–2012
        d3:
          type: number
          description: Average anomaly 2013–2023
        acceleration:
          type: number
          description: d3 minus d1 — net change across the study period
      required: [country, code, d1, d2, d3, acceleration]

    GlobalDecadeAvg:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        avg:
          type: number
      required: [key, label, avg]

    DecadeAnalysis:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/DecadeCountryRow"
        globalDecades:
          type: array
          items:
            $ref: "#/components/schemas/GlobalDecadeAvg"
      required: [countries, globalDecades]

    VolatilityCountry:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        mean:
          type: number
        volatility:
          type: number
        observations:
          type: integer
      required: [country, code, mean, volatility, observations]

    VolatilityData:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/VolatilityCountry"
        globalMean:
          type: number
        globalVolatility:
          type: number
      required: [countries, globalMean, globalVolatility]

    AccelerationPoint:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        slopeFullPeriod:
          type: number
          description: Linear slope (m/year) over full 1993–2023 period
        slopeFirstHalf:
          type: number
          description: Slope over first half of the period
        slopeSecondHalf:
          type: number
          description: Slope over second half of the period
        accelerating:
          type: boolean
          description: True if second-half slope exceeds first-half slope
      required:
        [
          country,
          code,
          slopeFullPeriod,
          slopeFirstHalf,
          slopeSecondHalf,
          accelerating,
        ]

    CountryRanking:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        mean:
          type: number
        volatility:
          type: number
        cumulativeRise:
          type: number
        peakValue:
          type: number
        peakYear:
          type: integer
        troughValue:
          type: number
        troughYear:
          type: integer
        slope:
          type: number
        d1Avg:
          type: number
        d3Avg:
          type: number
        decadeAcceleration:
          type: number
        observations:
          type: integer
      required:
        - country
        - code
        - mean
        - volatility
        - cumulativeRise
        - peakValue
        - peakYear
        - troughValue
        - troughYear
        - slope
        - d1Avg
        - d3Avg
        - decadeAcceleration
        - observations

    ForecastPoint:
      type: object
      properties:
        year:
          type: integer
        projected:
          type: number
          description: Projected average sea level anomaly
        lower:
          type: number
          description: Lower confidence bound (−2σ)
        upper:
          type: number
          description: Upper confidence bound (+2σ)
      required: [year, projected, lower, upper]

    HistoricalForecastPoint:
      type: object
      properties:
        year:
          type: integer
        avgAnomaly:
          type: number
      required: [year, avgAnomaly]

    ForecastData:
      type: object
      properties:
        historical:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalForecastPoint"
        projected:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        slopeMmPerYear:
          type: number
          description: Linear trend slope in mm/year
        r2:
          type: number
          description: Coefficient of determination (model fit quality)
        projectedRise2030:
          type: number
          description: Projected cumulative anomaly increase by 2030
        projectedRise2033:
          type: number
          description: Projected cumulative anomaly increase by 2033
      required:
        [
          historical,
          projected,
          slopeMmPerYear,
          r2,
          projectedRise2030,
          projectedRise2033,
        ]

    RiskScoreComponents:
      type: object
      properties:
        riseScore:
          type: number
        slopeScore:
          type: number
        volatilityScore:
          type: number
        accelerationScore:
          type: number
      required: [riseScore, slopeScore, volatilityScore, accelerationScore]

    RiskScore:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        riskScore:
          type: number
          description: Composite risk score 0–100
        riskLevel:
          type: string
          enum: [Critical, High, Medium, Low]
        components:
          $ref: "#/components/schemas/RiskScoreComponents"
        cumulativeRise:
          type: number
        slope:
          type: number
        volatility:
          type: number
        decadeAcceleration:
          type: number
      required:
        [
          country,
          code,
          riskScore,
          riskLevel,
          components,
          cumulativeRise,
          slope,
          volatility,
          decadeAcceleration,
        ]

    RiskScoreData:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/RiskScore"
        avgRiskScore:
          type: number
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer
      required:
        [
          countries,
          avgRiskScore,
          criticalCount,
          highCount,
          mediumCount,
          lowCount,
        ]

    CountryProfileTimeSeries:
      type: object
      properties:
        year:
          type: integer
        value:
          type: number
        rollingAvg:
          type: number
      required: [year, value, rollingAvg]

    CountryProfileDecade:
      type: object
      properties:
        label:
          type: string
        avg:
          type: number
        count:
          type: integer
      required: [label, avg, count]

    CountryProfileStats:
      type: object
      properties:
        mean:
          type: number
        volatility:
          type: number
        cumulativeRise:
          type: number
        slope:
          type: number
        peakValue:
          type: number
        peakYear:
          type: integer
        troughValue:
          type: number
        troughYear:
          type: integer
        observations:
          type: integer
        rankByCumulativeRise:
          type: integer
        totalCountries:
          type: integer
      required:
        - mean
        - volatility
        - cumulativeRise
        - slope
        - peakValue
        - peakYear
        - troughValue
        - troughYear
        - observations
        - rankByCumulativeRise
        - totalCountries

    CountryProfile:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        timeSeries:
          type: array
          items:
            $ref: "#/components/schemas/CountryProfileTimeSeries"
        decadeBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CountryProfileDecade"
        stats:
          $ref: "#/components/schemas/CountryProfileStats"
      required: [country, code, timeSeries, decadeBreakdown, stats]


    ThresholdCrossingNation:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        firstPositive:
          type: integer
          nullable: true
        firstTenth:
          type: integer
          nullable: true
        firstFifth:
          type: integer
          nullable: true
        yearsPositive:
          type: integer
        yearsAboveTenth:
          type: integer
        yearsAboveFifth:
          type: integer
        streakAboveZero:
          type: integer
        latestValue:
          type: number
        cumulativeRise:
          type: number
      required:
        [
          country,
          code,
          firstPositive,
          firstTenth,
          firstFifth,
          yearsPositive,
          yearsAboveTenth,
          yearsAboveFifth,
          streakAboveZero,
          latestValue,
          cumulativeRise,
        ]

    ThresholdCrossingSummary:
      type: object
      properties:
        crossedZero:
          type: integer
        crossedTenth:
          type: integer
        crossedFifth:
          type: integer
        total:
          type: integer
        avgFirstPositiveYear:
          type: number
      required:
        [crossedZero, crossedTenth, crossedFifth, total, avgFirstPositiveYear]

    ThresholdCrossingsData:
      type: object
      properties:
        nations:
          type: array
          items:
            $ref: "#/components/schemas/ThresholdCrossingNation"
        summary:
          $ref: "#/components/schemas/ThresholdCrossingSummary"
      required: [nations, summary]

    ENSONation:
      type: object
      properties:
        country:
          type: string
        code:
          type: string
        elNinoAvg:
          type: number
          description: Average sea level anomaly during El Niño years (1997-98, 2015-16)
        laNinaAvg:
          type: number
          description: Average sea level anomaly during La Niña years (2010-11, 2020-21)
        neutralAvg:
          type: number
          description: Average sea level anomaly during neutral years
        sensitivity:
          type: number
          description: La Niña avg minus El Niño avg — higher = more ENSO-sensitive
      required: [country, code, elNinoAvg, laNinaAvg, neutralAvg, sensitivity]

    ENSOGlobal:
      type: object
      properties:
        elNinoAvg:
          type: number
        laNinaAvg:
          type: number
        neutralAvg:
          type: number
      required: [elNinoAvg, laNinaAvg, neutralAvg]

    ENSOSensitivityData:
      type: object
      properties:
        nations:
          type: array
          items:
            $ref: "#/components/schemas/ENSONation"
        global:
          $ref: "#/components/schemas/ENSOGlobal"
        elNinoYears:
          type: array
          items:
            type: integer
        laNinaYears:
          type: array
          items:
            type: integer
      required: [nations, global, elNinoYears, laNinaYears]

    AnnualDeviationEntry:
      type: object
      properties:
        year: { type: integer }
        avg: { type: number }
        deviation: { type: number }
        enso: { type: string }
      required: [year, avg, deviation, enso]

    AnnualDeviationData:
      type: object
      properties:
        deviations:
          type: array
          items:
            $ref: "#/components/schemas/AnnualDeviationEntry"
        mean30yr: { type: number }
        maxDeviation: { type: number }
        minDeviation: { type: number }
      required: [deviations, mean30yr, maxDeviation, minDeviation]

