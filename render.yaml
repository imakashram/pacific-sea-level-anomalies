# Render Blueprint specification for the Express API server and React static frontend
services:
  # 1. Express API Backend
  - type: web
    name: pacific-sea-level-api
    runtime: node
    plan: free
    # Build using root monorepo setup
    buildCommand: pnpm install && pnpm run build:api
    # Run the compiled ES module server
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production

  # 2. React Vite Frontend (Static Site)
  - type: web
    name: pacific-sea-level-frontend
    runtime: static
    # Build the story frontend
    buildCommand: pnpm install && pnpm run build:story
    # Output folder
    staticPublishPath: artifacts/pacific-climate-story/dist/public
    routes:
      # Rewrite /api/* requests to the Express API backend URL
      # (Note: If your API URL on Render differs, update the host here)
      - type: rewrite
        source: /api/*
        destination: https://pacific-sea-level-api.onrender.com/api/*
      # Support client-side routing fallback for Single Page Application
      - type: rewrite
        source: /*
        destination: /index.html
