<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#023e8a" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#90e0ef" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Rounded background card -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  
  <!-- Wave 1 (Back, semi-transparent) -->
  <path d="M 0 130 C 45 110, 45 150, 90 130 C 135 110, 135 150, 180 130 L 180 180 L 0 180 Z" fill="#0077b6" opacity="0.5" />
  
  <!-- Wave 2 (Middle) -->
  <path d="M 0 110 C 45 130, 45 90, 90 110 C 135 130, 135 90, 180 110 L 180 180 L 0 180 Z" fill="#0096c7" opacity="0.7" />
  
  <!-- Wave 3 (Front, highlighted) -->
  <path d="M 0 90 C 45 70, 45 110, 90 90 C 135 70, 135 110, 180 90 L 180 180 L 0 180 Z" fill="url(#waveGrad)" />
</svg>
